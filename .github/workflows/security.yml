name: Security
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node scripts/verifySecrets.cjs
      - run: npx --no-install tsc --noEmit
      - run: node scripts/verifySessionSecurity.cjs
      - run: npm run verify:forms && npm run verify:permissions
      - run: npm audit --audit-level=critical
      - run: npm ci --ignore-scripts --prefix motion
      - run: npm audit --audit-level=high --prefix motion
