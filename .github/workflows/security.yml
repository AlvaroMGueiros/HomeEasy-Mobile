name: Security
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node scripts/verifySecrets.cjs
      - run: npx --no-install tsc --noEmit
      - run: node scripts/verifySessionSecurity.cjs
      - run: npm run verify:forms && npm run verify:permissions && npm run verify:product
      - run: npm audit --audit-level=critical
      - run: npm ci --ignore-scripts --prefix motion
      - run: node motion/node_modules/typescript/bin/tsc --project motion/tsconfig.json --noEmit
      - run: npm audit --audit-level=high --prefix motion
