name: Security
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node scripts/verifySecrets.cjs
      - run: npx --no-install tsc --noEmit
      - run: node scripts/verifySessionSecurity.cjs
      - run: npm run verify:forms && npm run verify:permissions && npm run verify:product
      - run: npm audit --audit-level=critical
      - run: npm ci --ignore-scripts --prefix motion
      - run: node motion/node_modules/typescript/bin/tsc --project motion/tsconfig.json --noEmit
      - run: npm audit --audit-level=high --prefix motion
